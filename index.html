      quizScore = 0;
      userAnswers = [];
      document.getElementById('quizQuestionBox').classList.remove('hidden');
      document.getElementById('quizOptions').classList.remove('hidden');
      document.getElementById('quizScoreBox').classList.add('hidden');
      renderQuizQuestion();
    }

    function renderQuizQuestion() {
      const q = quizQuestions[currentQuizQ];
      document.getElementById('quizNum').textContent = `PREGUNTA ${currentQuizQ + 1} DE ${quizQuestions.length}`;
      document.getElementById('quizText').textContent = q.q;

      const optionsBox = document.getElementById('quizOptions');
      optionsBox.innerHTML = '';

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = "p-6 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-2xl text-left text-sm sm:text-base font-extrabold text-slate-200 transition-all shadow-xl";
        btn.textContent = `${String.fromCharCode(65 + idx)}) ${opt}`;
        btn.onclick = () => answerQuiz(idx);
        optionsBox.appendChild(btn);
      });
    }

    function answerQuiz(selectedIdx) {
      userAnswers.push(selectedIdx);
      if (selectedIdx === quizQuestions[currentQuizQ].correct) {
        quizScore++;
      }

      currentQuizQ++;
      if (currentQuizQ < quizQuestions.length) {
        renderQuizQuestion();
      } else {
        renderQuizResults();
      }
    }

    function renderQuizResults() {
      document.getElementById('quizQuestionBox').classList.add('hidden');
      document.getElementById('quizOptions').classList.add('hidden');
      const scoreBox = document.getElementById('quizScoreBox');
      scoreBox.classList.remove('hidden');

      document.getElementById('quizScoreText').textContent = `El auditorio obtuvo ${quizScore} de ${quizQuestions.length} respuestas correctas.`;

      const reviewContainer = document.getElementById('quizDetailedReview');
      reviewContainer.innerHTML = '';

      quizQuestions.forEach((q, idx) => {
        const userAns = userAnswers[idx];
        const isCorrect = userAns === q.correct;
        const card = document.createElement('div');
        card.className = `p-6 rounded-3xl border shadow-xl ${isCorrect ? 'bg-emerald-950/30 border-emerald-500/40' : 'bg-red-950/30 border-red-500/40'}`;
        
        card.innerHTML = `
          <div class="flex items-start space-x-3">
            <div class="text-2xl mt-0.5">${isCorrect ? '✅' : '❌'}</div>
            <div class="space-y-2 flex-1">
              <h5 class="font-black text-white text-base sm:text-lg">${q.q}</h5>
              <p class="text-xs sm:text-sm text-slate-300 font-medium">
                • Tu respuesta elegida: <span class="font-bold ${isCorrect ? 'text-emerald-400' : 'text-red-400'}">${q.options[userAns]}</span>
                ${!isCorrect ? `<br>• La respuesta correcta era: <span class="font-bold text-emerald-400">${q.options[q.correct]}</span>` : ''}
              </p>
              <div class="p-3.5 bg-slate-900/90 rounded-2xl border border-slate-800 text-xs sm:text-sm text-slate-300 leading-relaxed font-medium">
                <strong>Explicación detallada:</strong> ${q.explanation}
              </div>
            </div>
          </div>
        `;
        reviewContainer.appendChild(card);
      });
    }

    window.onload = initPresentation;
  </script>
</body>
</html>
